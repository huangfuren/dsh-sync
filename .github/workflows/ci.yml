# CI 工作流：每次向 main 分支推送或发起针对 main 的 PR 时，
# 在多个 Node.js 版本 × 操作系统上执行语法检查与单元测试。
name: CI

# 触发条件：
# - push 到 main 分支
# - 针对 main 分支的 pull_request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限原则：仅授予读取仓库内容的权限，避免工作流获得写权限令牌。
permissions:
  contents: read

jobs:
  # 校验任务：在矩阵中列出的每个 Node.js 版本 × 操作系统上运行同一套校验。
  # 覆盖 Windows / macOS / Linux —— 本插件会生成 apply.ps1 与 apply.sh
  # 两套安装脚本，路径分隔符与换行都必须在这三类平台上成立。
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 即使某个组合失败也不中断其它组合，便于一次看全矩阵结果。
      fail-fast: false
      matrix:
        # Node 版本覆盖 engines 声明的兼容基线。
        node: [22, 24]
        # Ubuntu 显式钉版本：ubuntu-latest 自 2026-10-19 起迁往 Ubuntu 26，
        # 用最新标签会让「代码没动、CI 突然变红」混进排查范围。
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      # 拉取源码。
      - uses: actions/checkout@v4
      # 安装指定版本的 Node。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 安装依赖（无 lockfile，npm install 按区间解析）：0.9.0 起 lan.test.js 的「工具注册」
      # 用例 import 了宿主入口 index.js，它需要 @deepseek-ai/schemastery（dependencies）与
      # @deepseek-ai/dsh-tools（devDependencies + peer），干净环境缺包必报 ERR_MODULE_NOT_FOUND
      # —— 0.8.0 到 0.14.2 的 CI 全因此红着。lib/ 下的引擎测试不触达这些包，装一次全绿。
      - name: Install
        run: npm install --no-audit --no-fund
      # check 是 node --check（只解析语法，不解析 import）；test 是 node --test test/*.test.js。
      - name: Verify
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log
      # 失败时把**失败测试块**转成 annotation（不是 tail：TAP 的尾部只有 summary，
      # 断言详情在 not ok / ✖ 之后若干行里）。
      # 为什么要这一步：Actions 的日志下载端点需要仓库权限（匿名 GET
      # /repos/{owner}/{repo}/actions/jobs/<id>/logs 返回 403），而 annotation 是公开可读的。
      # 没有它，失败在外部只能看到「Process completed with exit code 1」，等于没有信息。
      - name: Surface failure as annotation
        if: failure()
        shell: bash
        run: |
          echo "::error::verify failed on ${{ matrix.os }} / Node ${{ matrix.node }}"
          if [ -f verify.log ]; then
            msg=$(awk '/^(not ok|✖)/{c=30} c>0{print; c--}' verify.log | head -n 120 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | head -c 6000)
            if [ -z "$msg" ]; then
              msg=$(tail -n 40 verify.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | head -c 6000)
            fi
            if [ -n "$msg" ]; then echo "::error::${msg}"; fi
          fi
